apiVersion: apps/v1
kind: Deployment
metadata:
  name: resend-webhook
  labels:
    app.kubernetes.io/name: resend-webhook
    app.kubernetes.io/part-of: email-provider-resend
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: resend-webhook
      app.kubernetes.io/part-of: email-provider-resend
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: resend-webhook
        app.kubernetes.io/part-of: email-provider-resend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: resend-webhook
          image: ghcr.io/milo-os/resend-provider:latest
          imagePullPolicy: IfNotPresent
          args:
            - resend-webhook
            - --webhook-port=$(WEBHOOK_PORT)
            - --cert-dir=$(CERT_DIR)
            - --cert-file=$(CERT_FILE)
            - --key-file=$(KEY_FILE)
            - --metrics-bind-address=$(METRICS_BIND_ADDRESS)
            - --email-from-address=$(EMAIL_FROM_ADDRESS)
            - --health-probe-bind-address=$(HEALTH_PROBE_BIND_ADDRESS)
          env:
            - name: WEBHOOK_PORT
              value: "8090"
            - name: CERT_DIR
              value: certs
            - name: CERT_FILE
              value: tls.crt
            - name: KEY_FILE
              value: tls.key
            - name: METRICS_BIND_ADDRESS
              value: ":8443"
            - name: HEALTH_PROBE_BIND_ADDRESS
              value: ":8081"
            # Set to the manager's EMAIL_FROM_ADDRESS to skip searching for
            # untagged delivery events from other senders. Empty searches for
            # every untagged event.
            - name: EMAIL_FROM_ADDRESS
              value: ""
          envFrom:
            - secretRef:
                name: resend-keys # MUST contain the key RESEND_WEBHOOK_SIGNING_KEY
          ports:
            - containerPort: 8443
              name: metrics
              protocol: TCP
            - containerPort: 8090
              name: webhook
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          volumeMounts: []
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi

      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      volumes: []